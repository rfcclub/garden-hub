name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:orca
      - run: npm run test:wake
      - run: npx vitest run tests/client-auto-wake/specs tests/github-issue-approval-action --maxWorkers=1 --no-file-parallelism
